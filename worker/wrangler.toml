# Worker de Métrica (ver README.md): por ahora, la IA en /ia. Se despliega solo desde GitHub
# (Workers Builds, carpeta `worker`) cada vez que cambia main.
name = "metrica"
main = "src/index.js"
compatibility_date = "2026-11-09"
workers_dev = true

[observability]
enabled = true

[vars]
# Desde qué páginas se lo puede llamar (separados por coma). La app nativa no manda Origin y pasa igual.
ORIGENES = "https://sw413sg.github.io"
# Confirmar el nombre exacto del modelo en la consola de OpenAI.
MODELO = "gpt-6.1-terra"
# Cuánto piensa el modelo antes de contestar (lo que piensa se cobra como salida): «low» gasta menos.
# Vacío, usa el de OpenAI por defecto.
ESFUERZO = "low"
# «Lo que cambiaría» lee la letra entera y tiene que entenderla: piensa un poco más (un pedido por letra).
ESFUERZO_REVISION = "medium"
# Bundle id de la app (target de Xcode, confirmado). Si no coincide con el del JWS, la compra no cuenta.
BUNDLE_ID = "com.sw413sg.metrica"
# 20 gratis por mes, contados por X-Metrica-Id. Las 300 de la suscripción, las 100 de Métrica +
# y los paquetes están en el código (worker/src/cuota.js), no acá: un cambio de variable no los infla.
CUPO_GRATIS = "20"
# Tope por IP y por mes del cupo gratis y de Sandbox. Una compra de Production no entra.
# En una NAT de operador puede hacer falta subirlo.
TOPE_IP = "100"
# App Review y TestFlight compran en Sandbox contra este servidor. No se les da la cuota real
# del producto: el mismo recibo (originalTransactionId) comparte este tope por mes, aunque rote el id.
SANDBOX_CONSULTAS_MES = "30"
# Tope de todas las consultas Sandbox juntas, por día, en todo el servidor.
SANDBOX_TOPE_GLOBAL_DIA = "300"
# Techo de pedidos de todos juntos en un día: 1000 son unos USD 3,50. Subirlo cuando salga al público.
TOPE_DIA = "1000"

# La cuota (bolsas, mes, IP). La clase se registra con el deploy; la instancia nace en el primer pedido.
[[durable_objects.bindings]]
name = "CUOTA"
class_name = "Cuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Cuota"]

# El contador de /probar (KV «metrica-uso», creado en el primer despliegue).
[[kv_namespaces]]
binding = "USO"
id = "a3fd4b83900d4b47ae6c1ee8937454eb"

# La clave de OpenAI NO va acá: se carga como secret OPENAI_API_KEY en el panel de Cloudflare.
