<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspiración Diaria - Avanzado</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-color: #2c2f33;
            --panel-bg: rgba(20, 22, 25, 0.85);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-hover: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
            --accent-color: #a8b2d1;
            --success-color: #4ade80;
            --warning-color: #fbbf24;
            --error-color: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
            transition: justify-content 0.4s ease;
        }

        body.show-config {
            justify-content: flex-start;
        }

        /* Paneles de Configuración (Solo Historial) */
        .history-panel, .controls {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 900px;
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

        .distraction-free-zone {
            display: none; 
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            gap: 20px;
            margin-top: 20px;
            animation: fadeIn 0.3s ease forwards;
        }

        body.show-config .distraction-free-zone {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .history-panel {
            flex-direction: column;
            margin-bottom: 30px;
            gap: 15px;
            max-width: 600px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }

        .history-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .history-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-height: 100px;
            overflow-y: auto;
            width: 100%;
            padding-top: 5px;
        }

        .history-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: default;
            text-transform: capitalize;
            color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            margin-bottom: 20px;
            justify-content: center;
        }

        .word-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: capitalize;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            opacity: 1;
            transform: translateY(0);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
        }

        .word-card:hover {
            background: var(--card-hover);
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .fade-out {
            opacity: 0;
            transform: translateY(10px);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--warning-color);
            font-size: 1.2rem;
            padding: 20px;
        }

        .controls {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        button {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        button:hover:not(:disabled) {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .progress-container {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            height: 6px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--text-color);
            width: 0%;
            transition: width 0.05s linear;
        }
        
        .time-left {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-top: -5px;
        }

        /* --- BARRA INFERIOR FIJA CON CONTROLES DIRECTOS Y SLIDERS FLOTANTES --- */
        .bottom-bar-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 98;
        }

        .persistent-pause-btn {
            background-color: rgba(20, 22, 25, 0.85);
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: border-color 0.2s ease, color 0.2s ease;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.25) 0%, transparent 0%);
            background-repeat: no-repeat;
        }

        .persistent-pause-btn:hover:not(:disabled) {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .persistent-pause-btn.btn-active {
            background-color: var(--warning-color) !important;
            color: var(--bg-color) !important;
            border-color: var(--warning-color) !important;
            background-image: none !important;
        }

        .quick-control-wrapper {
            position: relative;
            display: inline-block;
        }

        .quick-control-btn {
            background-color: rgba(20, 22, 25, 0.85);
            color: var(--accent-color);
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .quick-control-btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
            border-color: var(--text-color);
        }

        /* Menú desplegable con barra deslizadora (Slider Popup) */
        .slider-popup {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            background: rgba(20, 22, 25, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
            z-index: 100;
        }

        .slider-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
        }

        .slider-popup label {
            font-size: 0.8rem;
            color: var(--accent-color);
            text-align: center;
            font-weight: 600;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--text-color);
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        input[type=range]:focus { outline: none; }

        .filter-input-bar {
            background: rgba(20, 22, 25, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            width: 110px;
            outline: none;
            text-align: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            font-family: inherit;
        }

        .filter-input-bar::placeholder {
            color: var(--accent-color);
            opacity: 0.7;
        }

        .filter-input-bar:focus {
            border-color: var(--text-color);
            width: 140px;
        }

        .toggle-ui-btn {
            background-color: rgba(20, 22, 25, 0.85);
            color: var(--accent-color);
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .toggle-ui-btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
            border-color: var(--text-color);
        }
        .simple-words-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .simple-words-check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            border: 1.5px solid currentColor;
            border-radius: 4px;
            font-size: 12px;
        }
        .simple-words-btn[aria-pressed="true"] {
            border-color: var(--success-color);
            color: var(--success-color);
        }
        .simple-words-btn[aria-pressed="true"] .simple-words-check::after {
            content: '✓';
        }
        .simple-words-btn:focus-visible {
            outline: 2px solid var(--text-color);
            outline-offset: 4px;
        }
        .bottom-bar-container {
            flex-wrap: wrap;
            justify-content: center;
            width: max-content;
            max-width: calc(100% - 24px);
        }
        body { padding-bottom: 150px; }
    </style>
</head>
<body>

    <!-- Cuadrícula Principal -->
    <div class="grid" id="word-grid"></div>

    <!-- Barra Inferior Fija y Centrada con Pausa, Refrescar, Controles y Filtro -->
    <div class="bottom-bar-container">
        <button id="persistent-pause-btn" class="persistent-pause-btn btn-active" disabled>Reanudar</button>
        <button id="refresh-btn" class="quick-control-btn" disabled>Refrescar</button>
        
        <!-- Botón Desplegable para Segundos -->
        <div class="quick-control-wrapper">
            <button id="time-toggle-btn" class="quick-control-btn">Tiempo: 5s</button>
            <div class="slider-popup" id="time-popup">
                <label for="time-slider">Segundos: <span id="time-label">5</span></label>
                <input type="range" id="time-slider" min="1" max="60" value="5">
            </div>
        </div>

        <!-- Botón Desplegable para Cantidad de Palabras -->
        <div class="quick-control-wrapper">
            <button id="count-toggle-btn" class="quick-control-btn">Palabras: 6</button>
            <div class="slider-popup" id="count-popup">
                <label for="count-slider">Cantidad: <span id="count-label">6</span></label>
                <input type="range" id="count-slider" min="1" max="50" value="6">
            </div>
        </div>

        <button id="simple-words-btn" class="quick-control-btn simple-words-btn" aria-pressed="false" title="Usar las 20.000 palabras con mayor frecuencia de uso del diccionario" disabled>
            <span class="simple-words-check" aria-hidden="true"></span>Palabras simples
        </button>

        <!-- Cuadro de texto corto para filtrar terminación -->
        <input type="text" id="suffix-filter" class="filter-input-bar" placeholder="Terminación..." disabled>

        <button class="toggle-ui-btn" id="toggle-ui-btn">Historial</button>
    </div>

    <!-- Zona de Configuración Agrupada (Solo Historial y Progreso) -->
    <div class="distraction-free-zone" id="ui-panels-container">
        <div class="controls">
            <div class="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>
            <div class="time-left" id="time-text">Esperando datos</div>
        </div>

        <div class="history-panel">
            <div class="history-header">
                <span class="history-title">📜 Últimas palabras mostradas (Historial)</span>
                <span id="filter-stats" style="font-size: 0.8rem; color: var(--accent-color);">Total disponible: 0</span>
            </div>
            <div class="history-tags" id="history-tags">
                <span style="color: var(--accent-color); font-size: 0.85rem; font-style: italic;">Aún no hay registros...</span>
            </div>
        </div>
    </div>

    <script src="palabras.js"></script>
    <script src="palabras-simples.js"></script>

    <script>
        let refreshSeconds = 5;
        let wordCount = 6;
        let REFRESH_INTERVAL_MS = refreshSeconds * 1000;
        
        let simpleWordPool = [];
        let useSimpleWords = false;
        let renderTimeout;
        let originalWordPool = []; 
        let wordPool = [];         
        let availableWords = [];   
        let displayedWords = [];
        let recentHistory = [];    
        
        let startTime = Date.now();
        let timerInterval;
        
        let isSystemPaused = true; 
        let isManualPause = true; 
        let timeRemainingWhenPaused = REFRESH_INTERVAL_MS;

        const grid = document.getElementById('word-grid');
        const refreshBtn = document.getElementById('refresh-btn');
        const persistentPauseBtn = document.getElementById('persistent-pause-btn');
        const progress = document.getElementById('progress');
        const timeText = document.getElementById('time-text');
        
        const timeToggleBtn = document.getElementById('time-toggle-btn');
        const timePopup = document.getElementById('time-popup');
        const timeSlider = document.getElementById('time-slider');
        const timeLabel = document.getElementById('time-label');

        const countToggleBtn = document.getElementById('count-toggle-btn');
        const countPopup = document.getElementById('count-popup');
        const countSlider = document.getElementById('count-slider');
        const countLabel = document.getElementById('count-label');

        const simpleWordsBtn = document.getElementById('simple-words-btn');
        const suffixFilter = document.getElementById('suffix-filter');
        const filterStats = document.getElementById('filter-stats');
        const historyTags = document.getElementById('history-tags');

        const toggleUiBtn = document.getElementById('toggle-ui-btn');

        timeToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            timePopup.classList.toggle('active');
            countPopup.classList.remove('active');
        });

        countToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            countPopup.classList.toggle('active');
            timePopup.classList.remove('active');
        });

        document.addEventListener('click', () => {
            timePopup.classList.remove('active');
            countPopup.classList.remove('active');
        });

        timePopup.addEventListener('click', (e) => e.stopPropagation());
        countPopup.addEventListener('click', (e) => e.stopPropagation());

        toggleUiBtn.addEventListener('click', () => {
            document.body.classList.toggle('show-config');
            if (document.body.classList.contains('show-config')) {
                toggleUiBtn.textContent = "Ocultar Historial";
            } else {
                toggleUiBtn.textContent = "Historial";
            }
        });

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function fetchInitialWordPool() {
            try {
                if (typeof textoPalabras === 'undefined') {
                    throw new Error("La variable 'textoPalabras' no está definida.");
                }

                const rawWords = textoPalabras.split(/\r?\n/)
                    .map(word => word.trim())
                    .filter(word => word.length > 0);

                if (rawWords.length === 0) throw new Error("El archivo está vacío.");

                originalWordPool = [...rawWords];
                if (typeof textoPalabrasSimples !== 'undefined') {
                    const knownWords = new Set(originalWordPool);
                    simpleWordPool = [...new Set(textoPalabrasSimples.split(/\r?\n/)
                        .map(word => word.trim()).filter(word => knownWords.has(word)))];
                    simpleWordsBtn.disabled = simpleWordPool.length === 0;
                }
                wordPool = [...originalWordPool];

                filterStats.textContent = `Total disponible: ${wordPool.length}`;
                
                availableWords = shuffle([...wordPool]);
                
                refreshBtn.disabled = false;
                persistentPauseBtn.disabled = false;
                suffixFilter.disabled = false;
                
                renderWords();
                timeText.textContent = "Pausado manualmente";
                progress.style.backgroundColor = "var(--warning-color)";

            } catch (error) {
                console.error("Error al cargar datos:", error);
                originalWordPool = ["Error", "FaltaArchivo", "FormatoIncorrecto", "RevisarConsola"];
                wordPool = [...originalWordPool];
                availableWords = shuffle([...wordPool]);
                renderWords();
            }
        }

        function getNextWords(count) {
            // Excluye la tanda realmente visible, incluso durante clics rápidos.
            const key = word => word.normalize('NFC').toLowerCase();
            const excluded = new Set(displayedWords.map(key));
            availableWords = availableWords.filter(word => !excluded.has(key(word)));
            const selected = [];
            const take = () => {
                while (availableWords.length > 0 && selected.length < count) {
                    const word = availableWords.pop();
                    if (!excluded.has(key(word))) {
                        selected.push(word);
                        excluded.add(key(word));
                    }
                }
            };
            take();
            if (selected.length < count) {
                availableWords = shuffle(wordPool.filter(word => !excluded.has(key(word))));
                take();
            }
            return selected;
        }

        function renderWords() {
            clearTimeout(renderTimeout);
            if (wordPool.length === 0) {
                grid.innerHTML = '<div class="no-results">No se encontraron palabras con esta terminación.</div>';
                return;
            }

            const newWords = getNextWords(wordCount);
            if (newWords.length === 0) {
                grid.innerHTML = '<div class="no-results">No hay otras palabras disponibles con este filtro. Cambiá la terminación para ver más.</div>';
                return;
            }
            
            newWords.forEach(w => {
                if (!recentHistory.includes(w)) {
                    recentHistory.unshift(w);
                    if (recentHistory.length > 20) recentHistory.pop(); 
                }
            });
            updateHistoryUI();

            if (grid.children.length > 0) {
                const cards = Array.from(grid.children);
                cards.forEach(card => card.classList.add('fade-out'));
                
                renderTimeout = setTimeout(() => {
                    grid.innerHTML = '';
                    appendCards(grid, newWords);
                }, 300);
            } else {
                appendCards(grid, newWords);
            }
            
            startTime = Date.now();
            timeRemainingWhenPaused = REFRESH_INTERVAL_MS;
            
            if(!isSystemPaused) updateProgress();
        }

        function appendCards(container, words) {
            displayedWords = [...words];
            words.forEach(word => {
                const div = document.createElement('div');
                div.className = 'word-card';
                div.textContent = word;
                container.appendChild(div);
            });
        }

        function updateHistoryUI() {
            if (recentHistory.length === 0) return;
            historyTags.innerHTML = '';
            recentHistory.forEach(word => {
                const tag = document.createElement('div');
                tag.className = 'history-tag';
                tag.textContent = word;
                historyTags.appendChild(tag);
            });
        }

        function applyWordFilters() {
            clearTimeout(renderTimeout);
            const suffix = suffixFilter.value.trim().toLowerCase();
            const activePool = useSimpleWords ? simpleWordPool : originalWordPool;
            
            if (suffix === '') {
                wordPool = [...activePool];
            } else {
                wordPool = activePool.filter(word => word.toLowerCase().endsWith(suffix));
            }
            
            filterStats.textContent = `Total disponible: ${wordPool.length}`;
            availableWords = shuffle([...wordPool]);
            
            if (wordPool.length > 0) {
                renderWords();
                if (isSystemPaused && !isManualPause) resumeTimer();
            } else {
                grid.innerHTML = '<div class="no-results">No se encontraron palabras con esta terminación.</div>';
                pauseTimer("Sin resultados"); 
            }
        }

        suffixFilter.addEventListener('input', applyWordFilters);
        simpleWordsBtn.addEventListener('click', () => {
            useSimpleWords = !useSimpleWords;
            simpleWordsBtn.setAttribute('aria-pressed', String(useSimpleWords));
            applyWordFilters();
        });

        timeSlider.addEventListener('input', (e) => {
            refreshSeconds = parseInt(e.target.value);
            timeLabel.textContent = refreshSeconds;
            timeToggleBtn.textContent = `Tiempo: ${refreshSeconds}s`;
            REFRESH_INTERVAL_MS = refreshSeconds * 1000;
            
            startTime = Date.now();
            timeRemainingWhenPaused = REFRESH_INTERVAL_MS;
            if(!isSystemPaused && wordPool.length > 0) updateProgress();
        });

        countSlider.addEventListener('input', (e) => {
            wordCount = parseInt(e.target.value);
            countLabel.textContent = wordCount;
            countToggleBtn.textContent = `Palabras: ${wordCount}`;
            if(wordPool.length > 0) renderWords();
        });

        persistentPauseBtn.addEventListener('click', () => {
            if (isManualPause) {
                isManualPause = false;
                persistentPauseBtn.textContent = "Pausar";
                persistentPauseBtn.classList.remove('btn-active');
                if(wordPool.length > 0) resumeTimer();
            } else {
                isManualPause = true;
                persistentPauseBtn.textContent = "Reanudar";
                persistentPauseBtn.classList.add('btn-active');
                pauseTimer("Pausado manualmente");
            }
        });

        refreshBtn.addEventListener('click', () => {
            if(wordPool.length > 0) renderWords();
        });

        function pauseTimer(message = "Pausado") {
            if (isSystemPaused) return;
            isSystemPaused = true;
            timeRemainingWhenPaused = Math.max(REFRESH_INTERVAL_MS - (Date.now() - startTime), 0);
            timeText.textContent = message;
            progress.style.backgroundColor = "var(--warning-color)";
            persistentPauseBtn.style.backgroundImage = 'none';
        }

        function resumeTimer() {
            if (isManualPause || wordPool.length === 0) return;
            isSystemPaused = false;
            startTime = Date.now() - (REFRESH_INTERVAL_MS - timeRemainingWhenPaused);
            progress.style.backgroundColor = "var(--text-color)";
            updateProgress();
        }

        function updateProgress() {
            if (isSystemPaused || wordPool.length === 0) return;

            const now = Date.now();
            const elapsed = now - startTime;
            const remaining = Math.max(REFRESH_INTERVAL_MS - elapsed, 0);
            
            const percentage = (elapsed / REFRESH_INTERVAL_MS) * 100;
            progress.style.width = Math.min(percentage, 100) + '%';
            
            persistentPauseBtn.style.backgroundImage = `linear-gradient(to right, rgba(255, 255, 255, 0.25) ${percentage}%, transparent ${percentage}%)`;

            const secondsLeft = Math.ceil(remaining / 1000);
            timeText.textContent = `Actualizando en ${secondsLeft}s`;
            
            if (elapsed >= REFRESH_INTERVAL_MS) {
                renderWords();
            }
        }

        fetchInitialWordPool();
        timerInterval = setInterval(updateProgress, 50);

    </script>
</body>
</html>
